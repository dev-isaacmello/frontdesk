[project]
name = "frontdesk"
version = "0.1.0"
description = "Multi-tenant customer service and scheduling agent for small businesses."
authors = [{ name = "Isaac Mello" }]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "alembic>=1.20.1",
    "azure-identity>=1.27.0",
    "azure-servicebus>=7.15.0",
    "fastapi>=0.163.1",
    "langgraph>=1.2.22",
    "openai>=3.53.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "PT", "RET", "SIM", "TC", "ARG", "PTH", "RUF", "S", "ASYNC"]
ignore = [
    "S101",  # assert is how pytest and internal invariants are written
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["N999"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests", "migrations", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers"
