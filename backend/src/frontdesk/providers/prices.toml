# Prices of the models this project can call, in USD per million tokens.
#
# `version` is the date the prices were read. Every ledger row stores it, so a cost can
# always be traced to the table that produced it. Change a price by adding a new dated
# version in a commit, never by editing history.
#
# `reasoning = false` marks a model that takes no reasoning effort. The default is true.

version = "2026-11-17"

[models.gpt-5-mini]
# Azure OpenAI, Global Standard. Azure Retail Prices API, meters "GPT 5 Mini Inpt Glbl",
# "GPT 5 Mini cchd Inpt Glbl" and "GPT 5 Mini outpt Glbl".
# https://prices.azure.com/api/retail/prices
input = "0.25"
cache_read = "0.025"
output = "2.00"

[models."gpt-4.1-mini"]
# Azure OpenAI, Global Standard. Meters "gpt 4.1 mini Inp glbl", "cached Inp glbl" and
# "Outp glbl", priced per thousand tokens.
input = "0.40"
cache_read = "0.10"
output = "1.60"
# It does not reason, and rejects a request that carries a reasoning effort.
reasoning = false

[models.gpt-oss-120b]
# Foundry, Global Standard. Meters "gpt-oss-120B Inp glbl" and "Outp glbl", per thousand.
input = "0.15"
output = "0.60"

[models."Llama-3.3-70B-Instruct"]
# Foundry, Global Standard. Meters "Llama 3.3 70B Inp glbl" and "Outp glbl", per thousand.
input = "0.71"
output = "0.71"
reasoning = false

[models.Phi-4]
# Foundry, Global Standard. Meters "Phi-4-Input Tokens" and "Phi-4-Output Tokens", per thousand.
input = "0.125"
output = "0.50"
reasoning = false

[models.Phi-4-mini-instruct]
# Foundry, Global Standard. Meters "Phi-4-Mini-Input Tokens" and "Phi-4-Mini-Output Tokens".
input = "0.075"
output = "0.30"
reasoning = false

[models.text-embedding-3-small]
# Azure OpenAI, Global Standard. Meter "text-embedding-3-small-glbl Tokens", per thousand.
input = "0.02"
output = "0"
reasoning = false

[models.offline-hashing]
# The offline stand-in for embeddings. It makes no billed call.
input = "0"
output = "0"
reasoning = false

[models.offline]
# The deterministic stand-in. It makes no billed call.
reasoning = false
input = "0"
output = "0"
